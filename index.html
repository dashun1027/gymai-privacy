<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GymAI 是為重量訓練者打造的個人健身紀錄與分析工具。">
  <title>GymAI｜你的訓練，清楚看見進步</title>
  <style>
    :root {
      --card: #ffffff;
      --border: #d9e5f2;
      --text: #102a4c;
      --muted: #5d718a;
      --blue: #1f64ad;
      --blue-dark: #083b78;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #e8f3ff 0%, #ffffff 48%, #f0f7ff 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    main {
      width: min(100% - 40px, 600px);
      margin: 0 auto;
      padding: 72px 0 44px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 108px;
      height: 108px;
      margin: 0 auto 20px;
      object-fit: cover;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 14px 32px rgba(24, 74, 128, .18);
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 9vw, 52px);
      letter-spacing: -.04em;
    }

    .intro {
      max-width: 450px;
      margin: 12px auto 30px;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.7;
    }

    .download {
      display: block;
      padding: 18px 20px;
      border-radius: 14px;
      background: var(--blue);
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      text-decoration: none;
    }

    .download:hover { filter: brightness(1.08); }

    .note {
      margin: 12px 0 38px;
      color: var(--muted);
      font-size: 16px;
    }

    .features {
      display: grid;
      gap: 14px;
      text-align: left;
    }

    .feature {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 8px 20px rgba(23, 72, 124, .06);
    }

    .feature h2 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.35;
    }

    .feature p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.75;
    }

    strong {
      color: var(--blue-dark);
      font-weight: 800;
      text-decoration-line: underline;
      text-decoration-color: #73aede;
      text-decoration-thickness: 2px;
      text-underline-offset: 5px;
    }

    footer {
      margin-top: 36px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 15px;
    }

    footer a {
      margin: 0 8px;
      color: var(--text);
      text-decoration: none;
    }

    footer p { margin: 18px 0 0; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./gymai-logo.JPG" alt="GymAI Logo">

    <h1>GymAI</h1>
    <p class="intro">
      把<strong>訓練</strong>、<strong>力量變化</strong>與<strong>肌群平衡</strong>集中整理，
      讓你<strong>看見自己的進步</strong>。
    </p>

    <a class="download"
       href="https://apps.apple.com/tw/app/gymai/id6798181081"
       target="_blank" rel="noopener">
      在 App Store 下載 GymAI
    </a>
    <p class="note">iPhone 與 iPad 適用</p>

    <section class="features">
      <article class="feature">
        <h2>快速記錄每次訓練</h2>
        <p>記錄動作、重量與次數，隨時從<strong>訓練日曆</strong>回顧每一天。</p>
      </article>

      <article class="feature">
        <h2>掌握力量變化</h2>
        <p>查看<strong>力量趨勢</strong>與個人最佳紀錄，了解每項動作是否持續進步。</p>
      </article>

      <article class="feature">
        <h2>檢視肌群平衡</h2>
        <p>依近期訓練紀錄整理<strong>肌群比例</strong>，協助辨識容易忽略的部位。</p>
      </article>

      <article class="feature">
        <h2>AI 教練分析</h2>
        <p>根據你的訓練歷程，提供<strong>今日訓練方向</strong>與恢復狀態分析。</p>
      </article>
    </section>

    <footer>
      <a href="./support.html">使用支援</a>
      <a href="./privacy-policy.html">隱私權政策</a>
      <a href="./terms-of-service.html">服務條款</a>
      <p>© 2026 GymAI</p>
    </footer>
  </main>
</body>
</html>
